<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
      <style>
        table {
    width: 50%;
    }
    table, th, td ,tr {
  border: 1px solid black;
}
    </style>
    <p> table tag is used for creating of table </p>
    <p>tr tag is used for creating rows</p>
    <p> th tag used inside table tag for defining col_name </p>
    <p> td tag used inside table tag for defining table cell col_name</p>
    
    <table>
        <tr>
            <th>ID</th>      <!-- col 1 -->
            <th>NAME</th>    <!-- col 2 -->             <!-- row 1 -->        
            <th>AGE</th>     <!-- col 3 -->                   
        </tr>
        
    <table>
        <tr>
            <td>831</td>      <!-- col 1 -->
            <td>piyush</td>    <!-- col 2 -->             <!-- row 2 -->
            <td>25</td>     <!-- col 3 -->                   
        </tr>
        
    <table>
        <tr>
            <td>832</td>      <!-- col 1 -->
            <td>raman</td>    <!-- col 2 -->             <!-- row 3 -->
            <td>11</td>     <!-- col 3 -->                   
        </tr>
        
    </table>
</body>
</html>
