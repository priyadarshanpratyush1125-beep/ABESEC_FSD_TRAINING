<!DOCTYPE html>
<html>

<head>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh
        }

        .card {
            width: 300px;
            border: 2px solid;
            padding: 20px;
            text-align: center
        }

        input,
        button {
            width: 90%;
            padding: 8px;
            margin: 5px
        }
    </style>
</head>

<body>

    <div class="card" id="card">
        <h2>Online Shop</h2>
        <p>Tea : 100</p>
        <p>Coffee : 200</p>
        <p>Rice : 500</p>
        <p>Aata : 700</p>

        <button onclick="step1()">Buy Now</button>
    </div>

    <script>
        let p, q, price = { "tea": 100, "coffee": 200, "rice": 500, "aata": 700 };

        function step1() {
            card.innerHTML = `<h3>Enter Product Name</h3>
    <input id="p"><br>
    <button onclick="step2()">Next</button>`;
        }

        function step2() {
            p = document.getElementById("p").value.toLowerCase();
            card.innerHTML = `<h3>Enter Quantity</h3>
    <input type="number" id="q"><br>
    <button onclick="bill()">Submit</button>`;
        }

        function bill() {
            q = document.getElementById("q").value;
            card.innerHTML = `<h2>Your Total Amount Is ₹${price[p] * q}</h2>`;
        }
    </script>

</body>

</html>
